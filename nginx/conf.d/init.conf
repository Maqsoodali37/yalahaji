# ── Temporary config for first-time SSL certificate issuance ──────────────────
# Use this BEFORE running certbot for the first time.
# After certificates are issued, DELETE this file and restart nginx.
# See VPS-DOCKER-DEPLOYMENT.md Section 9 for full SSL setup steps.

server {
    listen 80;
    server_name yalahaji.com www.yalahaji.com admin.yalahaji.com api.yalahaji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "OK — yalahaji.com is up. Please wait for SSL setup.";
        add_header Content-Type text/plain;
    }
}
