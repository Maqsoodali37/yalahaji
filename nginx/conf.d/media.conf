# ── media.yalahaji.com → MinIO (public read) ─────────────────────────────────
server {
    listen 80;
    server_name media.yalahaji.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name media.yalahaji.com;

    ssl_certificate     /etc/letsencrypt/live/yalahaji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalahaji.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Public bucket — served via MinIO on port 9000
    location / {
        proxy_pass         http://minio:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache public media aggressively at the edge
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  x-minio-deployment-id;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        add_header         Vary Accept-Encoding;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# ── minio-console.yalahaji.com → MinIO Web UI (port 9001, restricted) ────────
server {
    listen 80;
    server_name minio-console.yalahaji.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name minio-console.yalahaji.com;

    ssl_certificate     /etc/letsencrypt/live/yalahaji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalahaji.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Restrict to your office/home IP — change this
    # allow 203.0.113.0;
    # deny  all;

    location / {
        proxy_pass              http://minio:9001;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_read_timeout      900s;
        client_max_body_size    500M;
    }
}
