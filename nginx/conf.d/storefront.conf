# ─────────────────────────────────────────────────────────────────────────────
#  yalahaji.com · www.yalahaji.com  →  Next.js storefront (127.0.0.1:3000)
#
#  Host nginx version. deploy/nginx/conf.d/yalahaji.conf is the Docker-nginx
#  variant and proxies to "storefront:3000" — that upstream does not resolve
#  when nginx runs on the host. Use this file, not that one.
#
#  PREREQUISITES
#    1. DNS   A record:  @    →  <VPS IP>
#             A record:  www  →  <VPS IP>
#    2. Cert: certbot --nginx -d yalahaji.com -d www.yalahaji.com
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name yalahaji.com www.yalahaji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Canonical host: www → apex, so Google sees one address, not two.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.yalahaji.com;

    ssl_certificate     /etc/letsencrypt/live/yalahaji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalahaji.com/privkey.pem;

    return 301 https://yalahaji.com$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name yalahaji.com;

    ssl_certificate     /etc/letsencrypt/live/yalahaji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yalahaji.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Enable once HTTPS is confirmed working on every subdomain — a premature
    # preload commitment is painful to unwind.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml application/xml+rss text/xsl image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output — safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next's image optimiser output.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Static files from public/ — includes og-image.png and the icons.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Generated by app/sitemap.xml/route.ts and app/robots.ts. Short cache so an
    # updated product list reaches crawlers without a day's delay. sitemap.xsl
    # is the browser-only stylesheet the sitemap points at — it must be served
    # from this same origin or Chrome refuses to apply the transform.
    location ~ ^/(sitemap\.xml|sitemap\.xsl|robots\.txt|manifest\.webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
