# ─────────────────────────────────────────────────────────────────────────────
#  cdn.yalahaji.com  →  MinIO object storage (127.0.0.1:9000)
#
#  Serves uploaded product media. Matches MINIO_PUBLIC_URL in .env:
#      https://cdn.yalahaji.com/yalahaji
#  ...where "yalahaji" is MINIO_BUCKET, so object key "products/ihram.webp"
#  resolves to https://cdn.yalahaji.com/yalahaji/products/ihram.webp
#
#  Host nginx — upstream is 127.0.0.1:MINIO_HOST_PORT, not a Docker name.
#
#  This file mirrors what Certbot manages on the VPS. The certificate lives
#  under live/yalahaji.com/ because all hostnames were issued in one run, so
#  cdn.yalahaji.com is a SAN on that cert rather than having its own.
#  Confirm with:  sudo certbot certificates
#
#  PREREQUISITE: the bucket must allow anonymous reads or every image 403s:
#      mc anonymous set download local/yalahaji
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name cdn.yalahaji.com;

    client_max_body_size 50M;

    # Read-only media host — no cookies, no credentials.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # The MinIO admin API is also mounted on :9000. Unauthenticated calls are
    # rejected by signature checks, but there is no reason to expose the
    # surface publicly at all.
    location /minio/ {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # MinIO streams object bodies. Buffering them makes nginx spool large
        # files to disk before the first byte reaches the client.
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;

        # The point of the subdomain: let browsers and any upstream CDN hold
        # the object. Media is content-addressed — a replaced image gets a new
        # key — so a long immutable TTL is safe.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        # Needed only if media is ever read client-side (canvas, fetch()).
        # next/image fetches server-side and does not require this.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    }

    listen 443 ssl; # managed by Certbot
    http2  on;
    ssl_certificate     /etc/letsencrypt/live/yalahaji.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yalahaji.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = cdn.yalahaji.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name cdn.yalahaji.com;
    return 404; # managed by Certbot
}
