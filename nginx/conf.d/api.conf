# ─────────────────────────────────────────────────────────────────────────────
#  api.yalahaji.com  →  NestJS API (127.0.0.1:4000)
#
#  Referenced by NEXT_PUBLIC_API_URL and NEXT_PUBLIC_ADMIN_API_URL in .env.
#  Host nginx, so the upstream is 127.0.0.1:API_HOST_PORT — not "api:4000".
#
#  PREREQUISITES
#    1. DNS   A record:  api  →  <VPS IP>
#    2. Cert: certbot --nginx -d api.yalahaji.com
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80;
    listen      [::]:80;
    server_name api.yalahaji.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.yalahaji.com;

    ssl_certificate     /etc/letsencrypt/live/api.yalahaji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yalahaji.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Product image uploads from the admin panel pass through this host.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY     always;

    location / {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The admin session is a cookie scoped to COOKIE_DOMAIN (.yalahaji.com);
        # these headers are what let the API mark it Secure correctly.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_cache_bypass    $http_upgrade;
    }
}
